<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
body{margin:0;height:100vh;font:28px sans-serif;color:#fff;background:linear-gradient(120deg,#e66,#66e,#6e6);background-size:400% 400%;animation:m 3s linear infinite}
@keyframes m{0%{background-position:0 0}100%{background-position:100% 100%}}
.glass{position:absolute;left:80px;top:80px;width:700px;padding:40px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);background:rgba(255,255,255,0.12);border-radius:20px}
.glass2{top:400px;background:transparent}
</style></head><body>
<div class="glass">Cam panel 1 (yari saydam beyaz)</div>
<div class="glass glass2">Cam panel 2 (tamamen saydam)</div>
</body></html>
