<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Child Popup</title></head>
<body style="background:#fff; color:#000; padding:20px;">
    <h2>Child Popup</h2>
    <button id="closeBtn" onclick="window.close()" style="font-size:24px; padding:10px 20px;">Close Popup</button>
    <script>
        if (window.opener) {
            window.opener.postMessage('HELLO', '*');
        }
    </script>
</body>
</html>
