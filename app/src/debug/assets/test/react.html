<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>React Controlled Input Test</title>
    <!-- React 18.3.1 UMD scripts -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 40px; font-size: 24px; }
        input { font-size: 28px; padding: 12px 20px; width: 80%; max-width: 600px; background: #222; color: #fff; border: 2px solid #555; border-radius: 8px; }
        input:focus { border-color: #0a84ff; outline: none; }
        #log { margin-top: 20px; color: #34c759; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [val, setVal] = React.useState('');

            React.useEffect(() => {
                console.log('PHANTOM: STATE ' + val);
                window.currentReactVal = val;
            }, [val]);

            return (
                <div>
                    <h2>React Controlled Input Test</h2>
                    <p>Alana dokunup telefondan yazı yazın:</p>
                    <input 
                        id="reactInput" 
                        value={val} 
                        onChange={(e) => setVal(e.target.value)} 
                        placeholder="React kontrollü alan..."
                    />
                    <div id="log">React State: "{val}"</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        window.addEventListener('DOMContentLoaded', () => {
            console.log('PHANTOM: READY react');
        });
    </script>
</body>
</html>
