<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Netlik Testi</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .line-h {
        width: 100%;
        height: 1px;
        background-color: #ffffff;
        margin: 16px 0;
      }
      .grid-box {
        width: 120px;
        height: 120px;
        border: 1px solid #ffffff;
        position: relative;
        margin: 16px 0;
      }
      .line-v {
        width: 1px;
        height: 100%;
        background-color: #ffffff;
        position: absolute;
        left: 60px;
        top: 0;
      }
      .text-12 { font-size: 12px; margin: 8px 0; }
      .text-16 { font-size: 16px; margin: 8px 0; }
      .text-24 { font-size: 24px; margin: 8px 0; font-weight: bold; }
      .icon-row { margin: 16px 0; }
    </style>
  </head>
  <body>
    <div class="text-24">24px Başlık Metni</div>
    <div class="text-16">16px Standart URL Metni</div>
    <div class="text-12">12px Küçük Açıklama Metni</div>

    <div class="line-h"></div>

    <div class="grid-box">
      <div class="line-v"></div>
    </div>

    <div class="icon-row">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span style="font-size:14px; margin-left:8px;">24px SVG İkon</span>
    </div>

    <p style="font-size:13px; color:#8e8e93; margin-top:24px;">
      Bu sayfa hiçbir CSS filtresi, opaklık veya ölçekleme olmadan saf 1px çizgiler ve fontlar ile render edilir.
    </p>
  </body>
</html>
